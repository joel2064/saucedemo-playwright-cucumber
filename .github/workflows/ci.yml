name: CI

# Corre la suite E2E en cada push a main y en cada Pull Request.
on:
  push:
    branches: [main]
  pull_request:

# Cancela corridas anteriores del mismo branch/PR si llega un push nuevo.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (Playwright + Cucumber)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v5

      - name: Configurar Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos (TypeScript)
        run: npm run typecheck

      - name: Instalar navegador de Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Ejecutar suite E2E
        run: npm test

      # Sube el reporte SIEMPRE (incluso si las pruebas fallan): es cuando más
      # sirve para diagnosticar. Incluye el HTML, el JSON y las trazas .zip.
      - name: Publicar reporte como artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cucumber-report
          path: reports/
          retention-days: 30
